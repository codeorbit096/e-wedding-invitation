<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fazal Baksh & Shibra | Wedding Invitation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #061a15;
    color: #e8d5a3;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    line-height: 1.6;
  }

  #opening {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #0a2a22 0%, #061a15 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #opening.hide {
    opacity: 0;
    visibility: hidden;
  }
  .open-btn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, #c9a84c, #8b6914);
    border: 3px solid #e8d5a3;
    color: #061a15;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(201,168,76,0.4);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }

  .card {
    background: linear-gradient(145deg, #0d2e26, #0a241e);
    border: 1px solid #c9a84c55;
    border-radius: 12px;
    padding: 28px 18px;
    margin-bottom: 22px;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid #c9a84c33;
    border-radius: 8px;
    pointer-events: none;
  }

  .ornament {
    text-align: center;
    color: #c9a84c;
    font-size: 22px;
    margin-bottom: 12px;
    letter-spacing: 8px;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: #c9a84c;
    text-align: center;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    text-align: center;
    color: #f5e6c8;
    margin: 5px 0;
    line-height: 1.2;
  }

  .divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin: 14px auto;
  }

  p {
    text-align: center;
    font-size: 14px;
    color: #d4c4a0;
    margin: 7px 0;
  }

  /* Photo Slider */
  .slider {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #c9a84c44;
    height: 320px;
  }
  .slides {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.6s ease;
  }
  .slide {
    width: 50%;
    height: 100%;
  }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .dots {
    text-align: center;
    margin-top: 12px;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 4px;
    background: #c9a84c55;
    border-radius: 50%;
    cursor: pointer;
  }
  .dot.active {
    background: #c9a84c;
  }

  .timeline {
    margin: 18px 0;
    padding-left: 18px;
    border-left: 2px solid #c9a84c44;
  }
  .timeline-item {
    position: relative;
    padding-bottom: 16px;
    padding-left: 14px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 4px;
    width: 9px;
    height: 9px;
    background: #c9a84c;
    border-radius: 50%;
  }
  .time {
    font-size: 13px;
    color: #c9a84c;
    font-weight: 500;
  }
  .event {
    font-size: 14px;
    color: #e8d5a3;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: linear-gradient(90deg, #c9a84c, #a88b2e);
    color: #061a15;
    border: none;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    margin: 12px 0;
    cursor: pointer;
  }

  .music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #c9a84c;
    color: #061a15;
    border: none;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  .footer {
    text-align: center;
    font-size: 12px;
    color: #8a7a5a;
    margin-top: 30px;
    padding-bottom: 20px;
  }
  .footer a {
    color: #c9a84c;
    text-decoration: none;
  }

  .confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    z-index: 999;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>
